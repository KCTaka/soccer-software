# Imported from model/robots/humanoid_prototype_1/source/Assembly.xml by `python3 -m model.generators.ingest_fusion model/robots/humanoid_prototype_1/ingest.yaml`.
# Re-importing rewrites frames, inertials, meshes, collision and closure pins, and keeps every other field.
# Masses and inertias: every part solid PLA (1.24 g/cm^3, infill not modelled) over its CAD geometry,
# bearings included, except the 16 RobStride 'Sim' bodies, which keep the CAD's catalogue mass spread
# uniformly over their shells (RS00 310.1 g, RS02 405.0 g, RS03 880.1 g, RS06 621.1 g; RobStride lists
# RS02 380 g and RS03 900 g). The CAD's own 500 kg/m^3 for printed parts is not used. PROVISIONAL until
# weighed: infill lowers the printed parts' mass, and real bearings are steel.
# Motors, by CAD part: hip pitch and knee RS03, hip roll RS06, hip yaw and shoulder pitch RS02, ankle
# (through the four-bar), shoulder roll and elbow RS00. Every actuator is PROVISIONAL (simulation
# only; RS03/RS06 firmware command ranges are unverified), so none is in model/motors.yaml.
# Effort and velocity limits: peak/rated torque RS00 14/5, RS02 17/6, RS03 60/21, RS06 36/11 N m;
# velocity RS00 33 and RS02 44 rad/s (model/motors.yaml), RS03 20 and RS06 50 rad/s (195 and 480 rpm
# no-load, RobStride Product_Information README). The ankle's are the RS00's divided by the four-bar's
# largest ratio, 1.22 within +-40 deg (docs/leg-prototype.md: the same 45/40/120/120 mm mechanism).
# Armatures are ESTIMATES of reflected rotor inertia: the leg prototype's RS02 estimate (0.002 kg m^2
# at 7.75:1) scaled by rotor inertia ~ mass^(5/3) and by gear ratio squared (RS00 10:1, RS03/RS06 9:1).
# Joint ranges are PROVISIONAL: the export has no stops. Typical kid-size ranges, clipped where the CAD
# meshes meet as each joint sweeps from the zero pose (hip roll inward 0.10 rad: the hip-yaw bracket
# meets the hip-pitch drive; knee 2.09: rod on hip-yaw motor; ankle toes-down 0.74: rod on shin; arm
# lowered 1.32: forearm on hip). The ankle's toes-up stop and +-0.6981 software limits are the leg
# prototype's; every other software limit sits 0.02 rad inside its stop. Combined poses are not swept.
# direction_sign is +1 everywhere, unverified: set each on hardware. The IMU is a placeholder at the
# pelvis frame origin (no IMU in the CAD).
