# GPU perception parameters, loaded by camera.launch.py into the ZED container.
#
# Engines are NOT baked into the image: they are version-locked to the TensorRT
# runtime and must be rebuilt when it changes. They live on a host bind mount
# (deploy/compose/robot.compose.yaml mounts ~/rfdetr-bench-models at /models).
# An empty engine_path is a supported state - each node degrades loudly rather
# than publishing wrong data.

/**/detector_node:
  ros__parameters:
    # Built by tools/rfdetr_bench.py with the trtexec that matches this runtime.
    engine_path: "/models/rfdetr_nano_fp16.engine"
    input_tensor: "input"
    boxes_tensor: "dets"
    labels_tensor: "labels"
    score_threshold: 0.45
    max_detections: 20
    # Stock RF-DETR is COCO-trained: 37 = sports ball, 1 = person. "person" is a
    # stand-in for "robot" and there is no goalpost class until we fine-tune.
    class_ids: [37, 1]
    class_names: ["ball", "robot"]
    image_topic: "camera/image_raw"

/**/fieldline_node:
  ros__parameters:
    # No segmentation engine trained yet -> the classical fallback runs. Set this
    # once a seg net is exported and the node switches backend on its own.
    engine_path: ""
    input_tensor: "input"
    mask_tensor: "mask"
    line_class: 1
    mask_threshold: 0.5
    max_points: 200
    max_range_m: 6.0
    confidence: 0.8
    # 2 => 640x360. Measured 29.0% of a core at full res, 9.3% at half.
    fallback_downscale: 2
    image_topic: "camera/image_raw"
    camera_info_topic: "camera/camera_info"
    # Mounting geometry. These are NOT intrinsics - fx/fy/cx/cy come from
    # camera_info at run time and must never be hardcoded again.
    mount_height_m: 0.30
    tilt_rad: 0.35
