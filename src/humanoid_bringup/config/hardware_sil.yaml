controller_manager:
  ros__parameters:
    update_rate: 200  # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    humanoid_mit_controller:
      type: humanoid_mit_controller/MitImpedanceController
humanoid_mit_controller:
  ros__parameters:
    transport_plugin: "humanoid_transport_mujoco/MujocoActuatorTransport"
    default_kp: 20.0
    default_kd: 1.0
    joints:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
      - waist_yaw_joint
      - waist_roll_joint
      - waist_pitch_joint
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint
    default_stiffness: 0.0
    default_damping: 0.0

# SIL-only simulator node, created inside ros2_control_node by
# MujocoActuatorTransport and read once at configure (parameters are
# read-only). mjcf_path, disturbance.push.force_n, and
# disturbance.push.start_time_s are launch arguments; see sil_stand.launch.py.
# Use float literals for doubles (0.2, not 0): an integer is a type error.
mujoco_sim:
  ros__parameters:
    disturbance:
      push:
        duration_s: 0.2
        body: torso_link
        direction: [0.0, 1.0, 0.0]  # world frame, normalised
