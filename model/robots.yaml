# Registry of robots the model pipeline generates. One entry per robot.
#
#   python3 -m model.generators.cli check                 # every robot
#   python3 -m model.generators.cli check    --robot bench_2s_10m
#   python3 -m model.generators.cli generate --robot bench_2s_10m
#
# `source` is each robot's hand-edited source of truth. unitree_g1's was first imported from
# MuJoCo Menagerie with `python3 -m model.generators.ingest` (see its source/ingest.yaml); that
# import is a one-off tool, not part of `check`.
#
# urdf, mjcf: emit <generated>/robot.urdf, robot.mjcf.
# firmware_config: emit <generated>/firmware_config.yaml (+ .sha256) for the firmware repo.
robots:
  unitree_g1:
    source: model/robots/unitree_g1/source/robot_model.yaml
    overlay: model/robots/unitree_g1/source/menagerie_contact_overlay.yaml
    generated: model/robots/unitree_g1/generated
    assets_dir: model/robots/unitree_g1/source/menagerie/unitree_g1/assets
    urdf: true
    mjcf: true
    firmware_config: false
  bench_2s_10m:
    source: model/robots/bench_2s_10m/source/robot_model.yaml
    overlay: null
    generated: model/robots/bench_2s_10m/generated
    assets_dir: null
    urdf: true
    mjcf: false
    firmware_config: true
    firmware_setup: 2s_10m
    stm32_wiring: true
    safety_manifest_path: config/bench_2s_10m/safety_manifest.yaml
    safety_manifest_package: humanoid_bringup
  bench_1s_5m:
    source: model/robots/bench_1s_5m/source/robot_model.yaml
    overlay: null
    generated: model/robots/bench_1s_5m/generated
    assets_dir: null
    urdf: true
    mjcf: false
    firmware_config: true
    firmware_setup: 1s_5m
    stm32_wiring: true
    safety_manifest_path: config/bench_1s_5m/safety_manifest.yaml
    safety_manifest_package: humanoid_bringup

default_robot: unitree_g1
