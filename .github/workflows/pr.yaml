name: pr

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.x
      - name: Run pin audit
        run: python3 tools/pin_audit.py
  build-and-test:
    needs: pin-audit
    env:
      HUMANOID_MJCF_PATH: /ws/model/generated/robot.mjcf
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build builder image
        run: >-
          docker buildx build
          --platform ${{ matrix.platform }}
          --file docker/builder.Dockerfile
          --tag local/builder:${{ github.sha }}
          --load
          .

      - name: Build workspace
        run: >-
          docker run --rm
          --platform ${{ matrix.platform }}
          --user root
          --env HUMANOID_MJCF_PATH=${{ env.HUMANOID_MJCF_PATH }}
          --volume "$GITHUB_WORKSPACE:/ws"
          --workdir /ws
          --entrypoint /bin/bash
          local/builder:${{ github.sha }}
          -lc 'source /opt/ros/jazzy/setup.bash && colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release -Werror=dev'

      - name: Test workspace
        run: >-
          docker run --rm
          --platform ${{ matrix.platform }}
          --user root
          --volume "$GITHUB_WORKSPACE:/ws"
          --workdir /ws
          --entrypoint /bin/bash
          local/builder:${{ github.sha }}
          -lc 'source /opt/ros/jazzy/setup.bash && source install/setup.bash && colcon test --packages-select humanoid_transport humanoid_safety humanoid_actuator_system humanoid_transport_mujoco && colcon test-result --verbose'
