# Drive limits per motor model, shared by every robot that uses it; an actuator names its model in
# `motor_class`. They are the firmware's per-model command ranges (firmware_config `models` and
# `shared_ranges`) and the safety manifest's stiffness and damping caps. Schema:
# model/schema/motors.schema.json.
