controller_manager:
  ros__parameters:
    update_rate: 200  # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster
    humanoid_mit_controller:
      type: humanoid_mit_controller/MitImpedanceController
# Publishes the <sensor name="imu"> of the robot description as sensor_msgs/Imu on
# /imu_sensor_broadcaster/imu. frame_id is the URDF frame the generator emits for that sensor.
imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: imu
    frame_id: imu_link
# The HumanoidActuatorSystem hardware component's node. ros2_control names it after the robot
# description's <ros2_control name>, lower-cased. These choose the deployment, not the robot, so
# the generated description does not carry them and the component has no defaults for them.
humanoidactuatorsystem:
  ros__parameters:
    transport_plugin: "humanoid_transport_mujoco/MujocoActuatorTransport"
# SIL-only simulator node, created inside ros2_control_node by
# MujocoActuatorTransport and read once at configure (parameters are
# read-only). mjcf_path, disturbance.push.force_n, and
# disturbance.push.start_time_s are launch arguments; see sil_stand.launch.py.
# Use float literals for doubles (0.2, not 0): an integer is a type error.
mujoco_sim:
  ros__parameters:
    disturbance:
      push:
        duration_s: 0.2
        direction: [0.0, 1.0, 0.0]  # world frame, normalised
